[package]
name = "sniplingo"
version = "0.1.0"
description = "SnipLingo Desktop Screenshot & Translation Assistant"
authors = ["SnipLingo Team"]
edition = "2021"
rust-version = "1.77.2"
license = "MIT"
repository = "https://github.com/c12hua/SnipLingo"

[lib]
name = "sniplingo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.6", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-global-shortcut = "2"
xcap = "0.9.8"
image = "0.25.6"
base64 = "0.23.1"
arboard = "3.6.1"
windows = { version = "0.61", features = ["Media_Ocr", "Globalization", "Graphics_Imaging", "Storage_Streams", "Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading"] }
reqwest = { version = "0.13.3", default-features = false, features = ["json", "rustls", "form", "query", "blocking"] }
md5 = "0.8.1"
ppocr-rs = { version = "0.7.3", features = ["fetch-models"] }
ort = { version = "=2.0.0-rc.9", default-features = false, features = ["load-dynamic", "ndarray", "half"] }
tokio = { version = "1", features = ["sync", "rt", "time"] }
rfd = "0.15"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true



